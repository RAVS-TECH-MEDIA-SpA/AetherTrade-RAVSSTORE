<div class="p-8 ml-64 bg-[#0d1117] min-h-screen w-[calc(100%-256px)] space-y-6">
    <div class="bg-[#161b22] border border-[#30363d] p-8 rounded-2xl shadow-xl flex flex-col gap-6">
        <div class="flex items-center gap-4">
            <div class="relative flex-1 flex flex-wrap items-center bg-[#0d1117] border border-[#30363d] rounded-xl px-4 py-2 gap-2 focus-within:border-[#00f2ff]">
                <div *ngFor="let tag of nichosSeleccionados" class="bg-[#23863626] text-[#3fb950] px-2 py-1 rounded text-xs font-bold">{{tag}}</div>
                <input [(ngModel)]="textoInput" (keyup.enter)="agregarTag()" placeholder="Nichos separados por ;" class="flex-1 bg-transparent border-none outline-none text-sm text-white px-2 py-2">
            </div>
            
            <div class="flex gap-3">
                <div class="flex flex-col gap-1">
                    <label class="text-[9px] text-[#8b949e] font-black uppercase">Amplitud</label>
                    <select [(ngModel)]="selectedNicheLimit" (change)="recalcularCuota()" class="bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2 text-xs text-white">
                        <option *ngFor="let n of [1,3,5,10]" [value]="n">{{n}} Nichos</option>
                    </select>
                </div>
                <div class="flex flex-col gap-1">
                    <label class="text-[9px] text-[#8b949e] font-black uppercase">Profundidad</label>
                    <select [(ngModel)]="selectedEliteLimit" (change)="recalcularCuota()" class="bg-[#0d1117] border border-[#30363d] rounded-lg px-3 py-2 text-xs text-white">
                        <option *ngFor="let n of [1,5,10,20,50]" [value]="n">Top {{n}}</option>
                    </select>
                </div>
            </div>

            <button (click)="onNewAnalysis()" [disabled]="isAnalyzing || totalEstimatedCredits > 100" class="bg-[#238636] hover:bg-[#2ea043] px-8 py-4 rounded-xl text-white font-bold flex items-center gap-2 self-end">
                New Analysis <span class="material-icons" [ngClass]="{'animate-spin': isAnalyzing}">bolt</span>
            </button>
        </div>
        <div class="flex justify-between text-[10px] font-black text-[#8b949e] uppercase tracking-widest border-t border-[#30363d] pt-4">
            <span>Quota monitor: {{totalEstimatedCredits}} credits estimated</span>
            <span [ngClass]="totalEstimatedCredits > 90 ? 'text-red-400' : 'text-[#3fb950]'">Plan Pro: 100/hour</span>
        </div>
    </div>

    <div class="bg-black border border-[#30363d] rounded-2xl overflow-hidden flex flex-col h-[550px] shadow-2xl">
        <div class="bg-[#161b22] px-4 py-2 flex justify-between border-b border-[#30363d] text-[10px] font-mono text-[#8b949e]">
            <span>AETHER-TRADE-TERMINAL</span>
            <div class="flex gap-1.5"><div class="w-3 h-3 rounded-full bg-[#ff5f56]"></div><div class="w-3 h-3 rounded-full bg-[#ffbd2e]"></div><div class="w-3 h-3 rounded-full bg-[#27c93f]"></div></div>
        </div>
        <div class="flex-1 p-6 font-mono text-sm overflow-y-auto space-y-1 custom-scrollbar">
            <div *ngFor="let log of logs" class="flex gap-4">
                <span class="text-gray-600">[{{log.time}}]</span>
                <span [ngClass]="{'text-blue-400': log.type==='info', 'text-green-400': log.type==='success', 'text-red-400': log.type==='error', 'text-gray-500': log.type==='system'}">{{log.msg}}</span>
            </div>
        </div>
    </div>
</div>
