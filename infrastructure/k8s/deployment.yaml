apiVersion: apps/v1
kind: Deployment
metadata:
  name: aethertrade-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: gateway
        image: gcr.io/tu-proyecto/aethertrade-api:latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: aethertrade-secrets